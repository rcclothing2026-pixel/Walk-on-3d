<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1014" />
    <meta name="description" content="تور مجازی ۳۶۰ درجه" />
    <title>تور مجازی</title>

    <!--
      Vazirmatn is self-hosted (Google Fonts is not reliably reachable from
      Iran) and loaded by @font-face in styles.css, which is in the critical
      path anyway.

      There is deliberately no <link rel="preload"> here: Vite prepends the
      base to root-relative URLs in this file, so /tour/fonts/… became
      /tour/tour/fonts/… and 404'd. A preload pointing at nothing is worse
      than no preload.
    -->
  </head>
  <body>
    <div id="viewer" class="viewer"></div>

    <!-- Never a blank sphere: the node's thumbnail sits blurred behind the bar. -->
    <div id="loader" class="loader" hidden>
      <div id="loader-thumb" class="loader__thumb"></div>
      <div class="loader__panel">
        <div class="loader__track"><div id="loader-bar" class="loader__bar"></div></div>
        <p class="loader__text">در حال بارگذاری…</p>
      </div>
    </div>

    <!-- aria-live so a screen reader announces the node name on every move. -->
    <p id="caption" class="caption" aria-live="polite" role="status"></p>

    <div id="error" class="error" role="alert" hidden>
      <p data-message></p>
      <p class="error__hint">صفحه را دوباره بارگذاری کنید.</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
