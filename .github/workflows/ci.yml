name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Audits every tour's graph on disk — structural errors and drift both
      # fail here, before anything is built.
      - name: Check tour graphs
        run: npm run nodes -- --check

      - name: Build
        run: npm run build
