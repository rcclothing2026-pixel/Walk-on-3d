<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studio — Walk on 3D</title>
    <link rel="stylesheet" href="./tools.css" />
  </head>
  <body class="studio">
    <header class="bar bar--top">
      <div class="group">
        <strong class="studio__title">Studio</strong>
        <select id="tour" class="select" aria-label="Tour"></select>
        <button id="new-tour" class="btn" title="Create a new tour">+ Tour</button>
      </div>

      <div class="group group--name">
        <span id="summary" class="progress"></span>
      </div>

      <div class="group">
        <button id="add-node" class="btn" title="Append a node to the roster">+ Node</button>
        <a id="design" class="btn" href="/tour/tools/design.html">Initial design</a>
        <a id="split" class="btn" href="/tour/tools/split.html">Split view</a>
        <a id="open-tour" class="btn" href="/tour/" target="_blank" rel="noopener">Open tour ↗</a>
        <button id="refresh" class="btn" title="Re-read the state from disk (R)">Refresh</button>
      </div>
    </header>

    <main class="studio__body">
      <section id="stale" class="status status--banner" data-kind="warn" role="status" hidden>
        <span>
          <strong>The graph is out of date.</strong> Links, alignment or names
          have changed since the last rebuild, so some arrows no longer match
          the plan.
        </span>
        <button id="stale-rebuild" class="btn">Rebuild the graph</button>
      </section>

      <section class="cards" id="cards"></section>

      <section class="tray" id="tray" hidden>
        <div class="tray__head">
          <span>Unassigned photos — drag one onto a row</span>
          <span id="tray-count" class="progress"></span>
        </div>
        <div class="tray__strip" id="tray-strip"></div>
      </section>

      <section class="studio__table">
        <table class="grid">
          <thead>
            <tr>
              <th>#</th>
              <th title="drag a photo here to assign it">Photo</th>
              <th>Name</th>
              <th>Type</th>
              <th title="renditions built by npm run process">Built</th>
              <th title="sphereCorrection.pan recorded">Aligned</th>
              <th title="arrows picked / total links">Arrows</th>
              <th title="placed on the floor plan">Map</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </main>

    <div id="log" class="studio__log" hidden>
      <div class="studio__log-head">
        <span id="log-title">Output</span>
        <button id="log-close" class="btn">Close</button>
      </div>
      <pre id="log-body"></pre>
    </div>

    <div id="status" class="status" role="status" hidden></div>

    <script type="module" src="./studio.js"></script>
  </body>
</html>
