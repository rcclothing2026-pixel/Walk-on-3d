<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studio — Walk on 3D</title>
    <link rel="stylesheet" href="./tools.css" />
  </head>
  <body class="studio">
    <header class="bar bar--top">
      <div class="group">
        <strong class="studio__title">Walk on 3D — studio</strong>
        <span id="summary" class="progress"></span>
      </div>

      <div class="group">
        <a class="btn" href="/tour/" target="_blank" rel="noopener">Open tour ↗</a>
        <button id="refresh" class="btn" title="Re-read the state from disk (R)">Refresh</button>
      </div>
    </header>

    <main class="studio__body">
      <section class="cards" id="cards"></section>

      <section class="studio__table">
        <table class="grid">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Type</th>
              <th title="raw/NN.jpg present">Photo</th>
              <th title="renditions built by npm run process">Built</th>
              <th title="sphereCorrection.pan recorded">Aligned</th>
              <th title="arrows picked / total links">Arrows</th>
              <th title="placed on the floor plan">Map</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </main>

    <div id="log" class="studio__log" hidden>
      <div class="studio__log-head">
        <span id="log-title">Output</span>
        <button id="log-close" class="btn">Close</button>
      </div>
      <pre id="log-body"></pre>
    </div>

    <div id="status" class="status" hidden></div>

    <script type="module" src="./studio.js"></script>
  </body>
</html>
