<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Initial design — Walk on 3D</title>
    <link rel="stylesheet" href="./tools.css" />
  </head>
  <body class="design-body">
    <header class="bar bar--top">
      <div class="group">
        <a id="home" class="btn" href="/tour/tools/studio.html" title="Tools, and this node elsewhere">☰</a>
        <button id="prev" class="btn" title="Previous node (Page Up)">‹</button>
        <select id="node" class="select" aria-label="Node"></select>
        <button id="next" class="btn" title="Next node (Page Down)">›</button>
      </div>

      <div class="group group--name">
        <span id="node-name" class="node-name" dir="rtl"></span>
        <span id="node-state" class="tag"></span>
      </div>

      <div class="group">
        <span id="progress" class="progress"></span>
        <button id="undo" class="btn" title="Undo the last change (Cmd/Ctrl+Z)" disabled>Undo</button>
        <button id="save" class="btn btn--primary" title="Anchor this node and move on">Save &amp; next</button>
      </div>
    </header>

    <div class="design">
      <section class="design__pano">
        <div id="viewer" class="viewer viewer--inset"></div>
        <div id="crosshair" class="crosshair" aria-hidden="true">
          <svg viewBox="-40 -40 80 80">
            <line x1="-34" y1="0" x2="-10" y2="0" />
            <line x1="10" y1="0" x2="34" y2="0" />
            <line x1="0" y1="-34" x2="0" y2="-10" />
            <line x1="0" y1="10" x2="0" y2="34" />
            <circle cx="0" cy="0" r="3" />
          </svg>
        </div>
        <p id="sight-label" class="sight-label"></p>
      </section>

      <section class="design__plan">
        <div id="plan-wrap" class="plan-wrap">
          <img id="plan" class="plan" alt="Floor plan" />
          <svg id="overlay" class="plan-overlay"></svg>
        </div>
      </section>
    </div>

    <footer class="bar bar--bottom">
      <div class="modes" role="group" aria-label="What a click on the plan does">
        <button id="mode-sight" class="btn is-on" data-mode="sight" title="Sight a neighbour (1)">Sight</button>
        <button id="mode-place" class="btn" data-mode="place" title="Put this node on the plan (2)">Place</button>
        <button id="mode-link" class="btn" data-mode="link" title="Connect this node to any other (3)">Link</button>
        <button id="mode-add" class="btn" data-mode="add" title="Create a node where you click (4)">Add</button>
      </div>

      <select id="target" class="select" aria-label="Which neighbour you are looking at"></select>
      <button id="record" class="btn">Record sighting</button>
      <button id="photo" class="btn" title="Give this node a photograph">Photo…</button>

      <span id="hint" class="design__hint"></span>
      <span id="calibration" class="tag" hidden></span>
      <button id="recalibrate" class="btn" title="Measure the handedness again" hidden>Re-calibrate</button>
      <button id="skip" class="btn" title="Leave this node alone and move on">Skip</button>
    </footer>

    <aside id="library" class="library" hidden>
      <header class="library__head">
        <span>Photographs — click one to give it to node <strong id="library-node"></strong></span>
        <button id="library-close" class="btn" aria-label="Close">&times;</button>
      </header>
      <div id="library-strip" class="library__strip"></div>
      <p class="library__hint">
        A photograph already on another node moves here — one node, one picture.
      </p>
    </aside>

    <div id="status" class="status" hidden></div>

    <script type="module" src="./design.js"></script>
  </body>
</html>
