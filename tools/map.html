<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map points — Walk on 3D</title>
    <link rel="stylesheet" href="./tools.css" />
  </head>
  <body class="has-panel">
    <div id="stage" class="stage">
      <div id="plan-wrap" class="plan-wrap">
        <img id="plan" class="plan" alt="Floor plan" />
        <svg id="overlay" class="plan-overlay"></svg>
      </div>
    </div>

    <header class="bar bar--top">
      <div class="group">
        <a id="home" class="btn" href="/tour/tools/studio.html" title="Back to the studio">☰</a>
        <button id="prev" class="btn" title="Previous node (Page Up)">‹</button>
        <select id="node" class="select" aria-label="Node"></select>
        <button id="next" class="btn" title="Next node (Page Down)">›</button>
      </div>

      <div class="group group--name">
        <span id="node-name" class="node-name" dir="rtl"></span>
        <span id="node-type" class="tag"></span>
        <span id="node-coords" class="tag"></span>
      </div>

      <div class="group">
        <div class="modes" role="group" aria-label="Mode">
          <button id="mode-place" class="btn is-on" data-mode="place" title="Position existing nodes (1)">Place</button>
          <button id="mode-add" class="btn" data-mode="add" title="Click the plan to create a node (2)">Add</button>
          <button id="mode-link" class="btn" data-mode="link" title="Click two nodes to connect them (3)">Link</button>
        </div>
        <span id="progress" class="progress"></span>
        <button id="download" class="btn btn--primary" title="Write the tour's data">Save</button>
      </div>
    </header>

    <aside class="panel">
      <div class="panel__head">
        <span>Nodes</span>
        <span id="placed-count" class="progress"></span>
      </div>
      <ol id="node-list" class="links"></ol>
      <p class="panel__hint" id="hint"></p>
    </aside>

    <footer class="bar bar--bottom">
      <span class="slider-label">zoom</span>
      <input id="zoom" class="slider" type="range" min="40" max="400" step="5" value="100" />
      <span id="zoom-value" class="progress">100%</span>
      <button id="fit" class="btn" title="Fit the plan to the window">Fit</button>
      <label class="slider-label"><input type="checkbox" id="show-links" checked /> links</label>
      <button id="upload" class="btn" title="Replace the floor plan (PNG, JPG or PDF)">Floor plan…</button>
      <input id="file" type="file" accept="image/*,.pdf" hidden />
      <button id="clear-node" class="btn" title="Unplace this node (Delete)">Clear node</button>
      <button id="rebuild" class="btn" title="Turn the links into arrows">Rebuild</button>
    </footer>

    <div id="status" class="status" hidden></div>

    <div id="help" class="help">
      <strong>1/2/3</strong> mode · <strong>Del</strong> unplace ·
      <strong>PgUp/PgDn</strong> node · drag to pan
    </div>

    <script type="module" src="./map.js"></script>
  </body>
</html>
